name: Pick stage race inventory regression
on:
  push:
    branches: [pick-stage-inventory-1127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-pick-stage-inventory.mjs
      - run: node test-pick-tickets-v34.mjs
      - run: node test-pick-tickets-sqr.mjs
      - run: node test-pick-tickets-customer-pwin.mjs
