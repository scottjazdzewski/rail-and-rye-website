name: Private Nov 24 Target List concise editorial update
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  source-locked-editorial-update:
    if: github.event.issue.number == 161 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_TARGET_1124_EDITORIAL_ADDENDUM_V1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private source validator and encryption
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Validate locked voice, preserve scoring, and write immutable private R2 revision
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/target_list_nov24_editorial_addendum.py
