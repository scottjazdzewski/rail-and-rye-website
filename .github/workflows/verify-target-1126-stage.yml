name: Verify private Nov26 Target List 3AM stage and live hold
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-target-1126-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/target-list-staging.js && node --check src/target-list.js && node --check src/index.js
      - name: Confirm scheduled Target List module imports and fail-closed missing-stage behavior
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {prepareScheduledTargetStages} from './src/target-list-staging.js';
          const env={CARDS_BUCKET:{get:async()=>null},STORE_DB:{}};
          const result=await prepareScheduledTargetStages(env,Date.UTC(2026,10,25,23,0,0));
          assert.deepEqual(result,{prepared:0,deferred:0});
          console.log('TARGET_1126_SCHEDULER_MODULE_VALIDATED');
          JS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet boto3==1.40.36 requests==2.32.3
      - name: Validate R2 stage, immutable current edition and scheduled catalog readiness
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import boto3,os,json,hashlib,requests
          from botocore.exceptions import ClientError
          B='rail-and-rye-private-cards';D='2026-11-26';ROOT='intelligence/target-list/staging/'+D+'/'
          SRC='20a001e4bbf88afb2701d6408e2cbfae63abb508cf18661d484e74d7f8ab0fc7'
          due='2026-11-26T08:00:00Z'
          c=boto3.client('s3',endpoint_url='https://'+os.environ['TRI_CLOUDFLARE_ACCOUNT_ID'].strip()+'.r2.cloudflarestorage.com',region_name='auto',aws_access_key_id=os.environ['TRI_R2_ACCESS_KEY_ID'].strip(),aws_secret_access_key=os.environ['TRI_R2_SECRET_ACCESS_KEY'].strip())
          def read(key):
            try:
              obj=c.get_object(Bucket=B,Key=key)
              return obj['Body'].read(),obj.get('Metadata',{})
            except ClientError as e:
              if e.response.get('Error',{}).get('Code') in ('404','NoSuchKey','NotFound'):return None,{}
              raise
          raw,meta=read(ROOT+'revision-0001.json')
          assert raw and meta.get('stage_only')=='true' and meta.get('release_at')==due and meta.get('source_sha256')==SRC
          h=hashlib.sha256(raw).hexdigest()
          assert h==meta['sha256']
          x=json.loads(raw)
          assert x['race_date']==D and x['release_at']==due and x['source_zip_sha256']==SRC
          assert len(x['source_receipts'])==6 and sum(a['races'] for a in x['source_receipts'])==56
          assert sum(a['runners'] for a in x['source_receipts'])==488
          assert len(x['selected_race_full_fields'])==len(x['targets'])==len(x['customer_edition']['targets'])==5
          assert all(abs(sum(h['win_probability_exact'] for h in r['runners'])-100)<1e-7 for r in x['selected_race_full_fields'])
          marker,mm=read(ROOT+'qa-0001.json')
          assert marker and json.loads(marker)['stage_sha256']==h
          print('TARGET_1126_PRIVATE_STAGE_READBACK_PASS source_6_tracks_56_races_488_horses_5_targets_3AM_ET sha256='+h,flush=True)
          old,oldmeta=read('racing-intelligence/product-tabs/target-list/2026-11-25.json')
          assert old and oldmeta.get('customer_publish_approved')=='true'
          print('TARGET_1125_CUSTOMER_EDITION_PRESERVED',flush=True)
          prepared,pm=read(ROOT+'prepared-0001.json')
          if prepared:
            proof=json.loads(prepared)
            assert proof['sha256']==h and proof['release_at']==due and proof['targets']==5 and proof['product_id']
            assert proof['catalog_release_at']=='2026-11-26 08:00:00'
            print('TARGET_1126_CATALOG_QUEUED_VERIFIED 3AM_ET product_id_present',flush=True)
          else:
            print('TARGET_1126_CATALOG_PENDING_MATCHING_RACE_CARD_STAGE',flush=True)
          matching=0;missing=0;different=0;max_delta=0.0
          for row in x['selected_race_full_fields']:
            slug=row['track'].casefold().replace(' ','-')
            remote,remoteMeta=read('projections/dashboard/'+D+'/'+slug+'.json')
            if remote is None:
              missing+=1;continue
            card=json.loads(remote)
            if remoteMeta.get('source_sha256')!=SRC or card.get('projection_status')!='prescratch':
              different+=1;continue
            race=next((v for v in card['races'] if v['race_number']==row['race']),None)
            if not race or len(race['entries'])!=len(row['runners']) or race.get('scratches'):
              different+=1;continue
            pairs={str(p['program_number']):p for p in race['entries']}
            issue=False
            for q in row['runners']:
              p=pairs.get(str(q['program_number']))
              if p is None:
                issue=True;break
              delta=abs(p['win_probability_exact']-q['win_probability_exact'])
              max_delta=max(max_delta,delta)
              if (delta>=.05 or round(p['win_probability_exact'],1)!=round(q['win_probability_exact'],1)
                  or p['horse_name']!=q['horse_name'] or p['morning_line']!=q['morning_line']
                  or p['trainer']!=q['trainer'] or p['jockey']!=q['jockey']):
                issue=True;break
            if issue:different+=1
            else:matching+=1
          print('TARGET_1126_SELECTED_RACE_PARITY display_matched='+str(matching)+' missing='+str(missing)+' different='+str(different)+' max_exact_pct_delta='+str(round(max_delta,6)),flush=True)
          if different:raise AssertionError('Selected staged race identity/display parity differs; hold customer publication')
          PY
