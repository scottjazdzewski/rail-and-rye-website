name: Verify Racing Intelligence CSS authority
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/projections-dashboard.css'
      - 'public/assets/pick-tickets-dashboard.css'
      - 'public/assets/longshot-radar.css'
      - 'public/assets/target-list-dashboard.css'
      - 'test-racing-intelligence-css-authority.mjs'
      - 'test-racing-intelligence-customer-copy.mjs'
      - 'public/assets/projections-dashboard.js'
      - 'public/assets/pick-tickets-dashboard.js'
      - 'public/assets/longshot-radar.js'
      - 'public/assets/target-list-dashboard.js'
      - 'public/admin/projections-preview.html'
      - 'public/admin/pick-tickets-preview.html'
      - 'public/admin/longshot-radar.html'
      - 'public/admin/target-list-preview.html'
      - 'public/membership/dashboard/index.html'
      - 'docs/RACING_INTELLIGENCE_HUB_DESIGN_SYSTEM.md'
      - '.github/workflows/verify-racing-intelligence-css-authority.yml'
  pull_request:
    paths:
      - 'public/assets/projections-dashboard.css'
      - 'public/assets/pick-tickets-dashboard.css'
      - 'public/assets/longshot-radar.css'
      - 'public/assets/target-list-dashboard.css'
      - 'test-racing-intelligence-css-authority.mjs'
      - 'test-racing-intelligence-customer-copy.mjs'
      - 'public/assets/projections-dashboard.js'
      - 'public/assets/pick-tickets-dashboard.js'
      - 'public/assets/longshot-radar.js'
      - 'public/assets/target-list-dashboard.js'
      - 'public/admin/projections-preview.html'
      - 'public/admin/pick-tickets-preview.html'
      - 'public/admin/longshot-radar.html'
      - 'public/admin/target-list-preview.html'
      - 'public/membership/dashboard/index.html'
      - 'docs/RACING_INTELLIGENCE_HUB_DESIGN_SYSTEM.md'
      - '.github/workflows/verify-racing-intelligence-css-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cascade-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce one declaration authority per selector and media scope
        run: node test-racing-intelligence-css-authority.mjs
      - name: Enforce production-wide customer copy and uploader lock
        run: node test-racing-intelligence-customer-copy.mjs
