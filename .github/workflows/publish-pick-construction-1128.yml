name: November 28 owner-approved Pick 5 and Pick 6 corrections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pick-construction-1128.yml','scripts/publish_pick_construction_1128.py','scripts/build_pick_construction_1128.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pick-construction-1128
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - run: node test-pick-final-field-gate.mjs && node test-pick-initial-rollover.mjs
      - name: Publish validated date-specific corrections and read back exact customer files
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/publish_pick_construction_1128.py
