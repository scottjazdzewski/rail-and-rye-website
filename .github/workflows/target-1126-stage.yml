name: Stage November 26 Target List private 3AM edition
on:
  push:
    branches: [main]
    paths: ['private-ingest/20261126/target.enc']
permissions:
  contents: read
concurrency:
  group: target-1126-prescratch-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Certify six TRI-scored tracks, source editorial and immutable private 3AM R2 stage
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/target_1126_stage.py
