name: Verify private Pick Tickets dashboard
on:
  push:
    branches: [main]
    paths:
      - 'src/pick-tickets.js'
      - 'src/pick-tickets-auto.js'
      - 'src/pick-tickets-menu-1124.js'
      - 'src/pick-tickets-v32.js'
      - 'src/pick-tickets-v33.js'
      - 'src/pick-tickets-v34.js'
      - 'src/pick-tickets-field-audit.js'
      - 'src/pick-tickets-v32-sensitivity.js'
      - 'src/pick-tickets-scratch-1123.js'
      - 'src/pick-tickets-intake.js'
      - 'src/projections.js'
      - 'src/index.js'
      - 'public/assets/pick-tickets-dashboard.*'
      - 'public/admin/pick-tickets-preview.html'
      - 'test-pick-tickets*.mjs'
      - '.github/workflows/verify-pick-tickets.yml'
  pull_request:
    paths:
      - 'src/pick-tickets.js'
      - 'src/pick-tickets-auto.js'
      - 'src/pick-tickets-menu-1124.js'
      - 'src/pick-tickets-v32.js'
      - 'src/pick-tickets-v33.js'
      - 'src/pick-tickets-v34.js'
      - 'src/pick-tickets-field-audit.js'
      - 'src/pick-tickets-v32-sensitivity.js'
      - 'src/pick-tickets-scratch-1123.js'
      - 'src/pick-tickets-intake.js'
      - 'src/projections.js'
      - 'src/index.js'
      - 'public/assets/pick-tickets-dashboard.*'
      - 'public/admin/pick-tickets-preview.html'
      - 'test-pick-tickets*.mjs'
      - '.github/workflows/verify-pick-tickets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pick-tickets-private:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source and browser renderer
        run: |
          node --check src/pick-tickets.js
          node --check src/pick-tickets-auto.js
          node --check src/pick-tickets-menu-1124.js
          node --check src/pick-tickets-v32.js
          node --check src/pick-tickets-v33.js
          node --check src/pick-tickets-field-audit.js
          node --check src/pick-tickets-v32-sensitivity.js
          node --check src/pick-tickets-scratch-1123.js
          node --check src/index.js
          node --check public/assets/pick-tickets-dashboard.js
      - name: Certified input, ticket integrity, revisions and private-route regression
        run: node test-pick-tickets.mjs
      - name: Frozen V3.2 Python mathematical parity and scratch guards
        run: node test-pick-tickets-v32.mjs
      - name: Versioned V3.3 exact 50%-per-leg and opportunity-cost optimization
        run: node test-pick-tickets-v33.mjs
      - name: Date-specific post time source verification
        run: node test-pick-tickets-post-times.mjs
      - name: Locked V3.4 exact length-sensitive frontier
        run: node test-pick-tickets-v34.mjs
      - name: Private V3.2 cost-sensitivity frontier parity
        run: node test-pick-tickets-v32-sensitivity.mjs
      - name: Current-date source-built tickets, exact PWIN and official wager menu
        run: node test-pick-tickets-auto.mjs
      - name: Every field upload reoptimizes and matches tickets to exact TRI source
        run: node test-pick-tickets-field-audit.mjs
      - name: Install Playwright and headless Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Six-viewport live DOM and overflow verification
        run: node test-pick-tickets-browser.mjs
      - name: Save private synthetic UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pick-tickets-responsive-qa
          path: test-artifacts/pick-tickets-*.png
          if-no-files-found: ignore
