name: TRI November 23 — write 1835 verified badge states privately
on:
  push:
    branches: [main]
    paths: ['secure-transfer/tri-20261123-badges.sealed.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private R2 and encryption clients
        run: python -m pip install --quiet --disable-pip-version-check boto3 cryptography brotli
      - name: Decrypt, verify official badge evidence, patch all five model cards and read back
        run: python scripts/tri_1123_verified_badge_patch.py publish --sealed-file secure-transfer/tri-20261123-badges.sealed.json
