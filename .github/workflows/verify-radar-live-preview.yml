name: Verify Longshot Radar protected live reader
on:
  push:
    branches: [main]
    paths:
      - 'public/longshot-radar-preview/**'
      - 'public/assets/longshot-radar.js'
      - 'public/assets/longshot-radar.css'
      - 'public/assets/rr-hub-header.css'
      - 'tests/longshot-radar-browser.mjs'
      - 'test-racing-intelligence-header.mjs'
      - 'public/admin/longshot-radar.html'
      - 'public/assets/target-list-dashboard.css'
      - 'public/admin/target-list-preview.html'
      - 'src/longshot-radar.js'
      - 'src/index.js'
      - '.github/workflows/verify-radar-live-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify live public URL hands off to admin and shows no paid data
        shell: bash
        run: |
          set -euo pipefail
          URL="https://railandryeracing.com/longshot-radar-preview/"
          for attempt in $(seq 1 12); do
            code=$(curl -LsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache'               -w '%{http_code}' -o /tmp/rr-radar-landing.html "$URL?rev=${GITHUB_SHA}-$attempt" || true)
            if [ "$code" = "200" ] &&
               grep -Fq 'http-equiv="refresh" content="0;url=/admin/longshot-radar/"' /tmp/rr-radar-landing.html &&
               grep -Fq 'href="/admin/longshot-radar/"' /tmp/rr-radar-landing.html &&
               ! grep -Fq 'rr-lr-candidates' /tmp/rr-radar-landing.html &&
               ! grep -Fq 'data-rr-design-only' /tmp/rr-radar-landing.html; then
              echo "PASS: live former design URL routes to protected genuine Radar, no fake/paid public rows"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Cloudflare has not deployed the protected Radar handoff."
              exit 1
            fi
            sleep 10
          done
          curl -fsSL --max-time 20 "https://railandryeracing.com/assets/longshot-radar.js?rev=${GITHUB_SHA}" -o /tmp/radar.js
          grep -Fq 'rr-lr-inline-analysis' /tmp/radar.js
          grep -Fq 'rr-lr-ml-inline' /tmp/radar.js
          grep -Fq 'rr-lr-racebar-main' /tmp/radar.js
          grep -Fq '/api/admin/longshot-radar-editorial' /tmp/radar.js
          grep -Fq 'async function loadPublishedCard()' /tmp/radar.js
          grep -Fq 'retry?.addEventListener("click",initialize)' /tmp/radar.js
          ! grep -Fq 'visualSample()' /tmp/radar.js
          ! grep -Fq 'rr-lr-upload-form' /tmp/radar.js
          echo "PASS: live Radar script auto-loads private R2 source without any user JSON picker"
          ! grep -Fq 'make("button","","Race details")' /tmp/radar.js
          # Allow Cloudflare's asset propagation to finish before verifying
          # exact bytes. A stale cache is not the same as a broken UI release.
          for attempt in $(seq 1 18); do
            token="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 20 "https://railandryeracing.com/assets/longshot-radar.css?rev=${token}" -o /tmp/radar.css || true
            curl -fsSL --max-time 20 "https://railandryeracing.com/assets/target-list-dashboard.css?rev=${token}" -o /tmp/target.css || true
            if cmp -s public/assets/longshot-radar.css /tmp/radar.css &&
               cmp -s public/assets/target-list-dashboard.css /tmp/target.css; then
              echo "PASS: live Cloudflare serves the current standalone Radar and Target CSS bytes"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::Live research CSS does not match main after propagation checks"
              exit 1
            fi
            sleep 6
          done
          grep -Fq 'Longshot Radar v4' /tmp/radar.css
          grep -Fq 'SHARED DAILY RESEARCH DESIGN STANDARD V1' /tmp/radar.css
          cmp public/assets/longshot-radar.js /tmp/radar.js
          grep -Fq 'Shared Daily Research Reader V1' /tmp/target.css

          for path in /assets/approved/brand/rail-rye-ivory-logo.png /assets/approved/saddlecloths/1.png /assets/approved/saddlecloths/11.png /assets/approved/saddlecloths/20.png; do
            curl -fsSL --max-time 20 "https://railandryeracing.com$path" -o /dev/null
            echo "PASS real graphic $path"
          done
          private=$(curl -sS --max-time 20 -w '%{http_code}' -o /tmp/radar-private-body.txt             'https://railandryeracing.com/api/admin/longshot-radar-editorial' || true)
          echo "Unauthenticated PRIVATE Radar URL (redirects NOT followed) returned HTTP $private"
          case "$private" in
            301|302|303|307|308|401|403|404|503) ;;
            *) echo "::error::Private Radar endpoint must not return content to an unauthenticated first request"; exit 1 ;;
          esac
          echo "PASS: live private Radar JS and CSS, canonical saddlecloths, authenticated R2 endpoint locked"
