name: Verify Nov24 Longshot Radar private feed and live reader
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_radar_1124_postpublish.py'
      - '.github/workflows/verify-radar-1124-postpublish.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable private 10-selection Radar and six complete TRI tracks
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip -q install boto3==1.40.36
          python scripts/verify_radar_1124_postpublish.py
      - name: Confirm live app retrieves latest dated private editions with no manual JSON upload
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 20 "https://railandryeracing.com/assets/longshot-radar.js?rev=${GITHUB_SHA}-$attempt" -o /tmp/rr-radar.js
            if grep -Fq 'async function loadAvailableEditions()' /tmp/rr-radar.js &&
               grep -Fq '"/api/admin/longshot-radar"' /tmp/rr-radar.js &&
               grep -Fq '"/api/admin/longshot-radar-editorial"' /tmp/rr-radar.js &&
               ! grep -Fq 'rr-lr-upload-form' /tmp/rr-radar.js; then
              echo "PASS: live Cloudflare reader loads latest prescratch Radar dates automatically"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Live Radar client still serves stale or non-publishing code"
              exit 1
            fi
            sleep 8
          done
          first=$(curl -sS --max-time 20 -w '%{http_code}' -o /tmp/rr-protected-firsthop              'https://railandryeracing.com/api/admin/longshot-radar' || true)
          case "$first" in
            301|302|303|307|308|401|403|404) echo "PASS: private Radar API denies unauthenticated access (HTTP $first)" ;;
            *) echo "::error::Private Radar API returned unexpected unauthenticated HTTP $first"; exit 1 ;;
          esac
