name: Private Target List review transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-target-list-review-transfer.yml'
      - 'scripts/target_list_private_review_bridge.py'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  recipient-public-key:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-key crypto
        run: pip install pynacl==1.5.0
      - name: Derive public encryption key from existing private R2 secret
        env:
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/target_list_private_review_bridge.py public-key --output target-list-review-public-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: target-list-review-public-key
          path: target-list-review-public-key.txt
          retention-days: 1
  encrypted-review-ingest:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 161 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_TARGET_REVIEW_ENCRYPTED_V1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R2 client and sealed-box crypto
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Decrypt privately, validate, upload R2 and verify readback
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/target_list_private_review_bridge.py ingest
