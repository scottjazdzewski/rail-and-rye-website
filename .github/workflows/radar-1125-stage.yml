name: Stage exact-source November 25 Longshot Radar privately
on:
  push:
    branches: [main]
    paths: ['private-ingest/20261125/radar.enc','private-ingest/20261125/radar-correction.enc']
permissions:
  contents: read
concurrency:
  group: radar-1125-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Validate encrypted editorial decisions against private frozen source and stage only on PASS
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/radar_1125_stage.py
