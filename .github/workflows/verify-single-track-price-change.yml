name: Verify single-track pricing migration
on:
  push:
    branches: [main]
    paths:
      - 'src/gpt-product-catalog.js'
      - 'test-single-track-price-change.mjs'
      - '.github/workflows/verify-single-track-price-change.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-sqlite test-single-track-price-change.mjs
