name: Verify automatic bundles
on:
  pull_request:
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'test-*.mjs'
      - '.github/workflows/verify-bundles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Stripe commerce regression
        run: node --experimental-sqlite test-v5.mjs
      - name: Bundle purchases, download protection and refund tests
        run: node --experimental-sqlite test-bundles.mjs
      - name: Bundle-buyer notifications for revised published and private PDFs
        run: node --experimental-sqlite test-bundle-update-notifications.mjs
      - name: Free public PDF without exposing paid or bundle-only files
        run: node --experimental-sqlite test-free-downloads.mjs
      - name: Scheduled publication embargo and automatic release tests
        run: node --experimental-sqlite test-scheduled-publications.mjs
      - name: Racing Wire official expansion validation
        run: node --experimental-sqlite test-racing-wire.mjs
      - name: Live Racing Wire health
        run: curl -sS --max-time 120 https://railandryeracing.com/api/preview/racing-wire-5333548f0ffee31ba519b2470ffb/feed-test
      - name: Probe official Racing Wire newsrooms
        run: |
          node --input-type=module <<'NODE'
          import {PREVIEW_OFFICIAL_NEWS_PAGES,parseOfficialNewsPage} from './src/racing-wire.js';
          for (const source of PREVIEW_OFFICIAL_NEWS_PAGES) {
            try {
              const r=await fetch(source.url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; RailAndRyeRacingWire/1.0; +https://railandryeracing.com)','Accept':'text/html,application/xhtml+xml;q=0.9,*/*;q=0.1'},redirect:'follow'});
              const html=await r.text();
              const items=parseOfficialNewsPage(html.slice(0,650000),source);
              console.log(JSON.stringify({id:source.id,status:r.status,bytes:html.length,parsed:items.length,newest:items.map(x=>x.published_at).sort().at(-1)||null,sample:items.slice(0,2).map(x=>x.title)}));
            } catch(e) { console.log(JSON.stringify({id:source.id,error:String(e)})); }
          }
          NODE
      - name: Inspect official newsroom link patterns
        run: |
          node --input-type=module <<'NODE'
          const sources=[
            ['breeders-cup','https://www.breederscup.com/news',['/news/']],
            ['fasig-tipton','https://www.fasigtipton.com/news',['/news/']],
            ['churchill-downs','https://www.churchilldowns.com/horses/news/',['/horses/news/']],
            ['santa-anita','https://www.santaanita.com/news/',['/news/']],
            ['del-mar','https://www.dmtc.com/media/news',['/media/news/']],
            ['gulfstream','https://www.gulfstreampark.com/news/',['/news/']]
          ];
          for(const [id,url,prefixes] of sources){
            const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'text/html'}});
            const html=await r.text();
            console.log('\n### '+id+' status='+r.status+' bytes='+html.length);
            const hrefs=[...html.matchAll(/href=["']([^"']+)["']/gi)].map(m=>({href:m[1],i:m.index||0})).filter(x=>prefixes.some(p=>x.href.includes(p)));
            const seen=new Set();
            for(const h of hrefs){
              if(seen.has(h.href))continue;seen.add(h.href);
              const snippet=html.slice(Math.max(0,h.i-280),Math.min(html.length,h.i+620)).replace(/\s+/g,' ');
              console.log(JSON.stringify({href:h.href,snippet:snippet.slice(0,850)}));
              if(seen.size>=8)break;
            }
          }
          NODE
      - name: Multi-collection bundle listing tests
        run: node --experimental-sqlite test-bundle-category-placement.mjs
      - name: Compact Publisher desktop layout and control regression
        run: node test-admin-desktop-density.mjs
      - name: Pages 3–5 and Journal Archive editorial and link regression
        run: node test-publication-page-polish.mjs
      - name: Journal article masthead and cover-image regression
        run: node test-journal-article-layout.mjs
      - name: Journal reading, related stories and sharing regression
        run: node test-journal-editorial-features.mjs
      - name: SEO sitemap, indexing, Journal rendering and robots regression
        run: node --experimental-sqlite test-seo.mjs
      - name: Static asset speed and storefront status regression
        run: node test-performance-copy.mjs
      - name: Private Racing Wire preview, author sources, and visibility tests
        run: node --experimental-sqlite test-racing-wire.mjs
