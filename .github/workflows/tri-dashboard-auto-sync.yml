name: Sync verified TRI prescratch projections to private R2

on:
  # Drive is the source of truth. This checks for a newly approved scorer ZIP
  # without consuming the site's general build/deploy pipeline.
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      source_file_id:
        description: "Optional source ZIP Drive file ID for a specific approved run"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tri-dashboard-private-r2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TRI_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.TRI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
      TRI_DRIVE_FOLDER_ID: ${{ vars.TRI_DRIVE_FOLDER_ID || '1yR79Mp8BndMd1KQfGEsbUOKvq-BJ2Vzd' }}
      TRI_SOURCE_FILE_ID: ${{ inputs.source_file_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline scoring-package integrity regression
        run: python -m unittest discover -s tests -p 'test_tri_dashboard_sync.py' -v
      - name: Check private service credentials are configured
        id: credentials
        shell: bash
        run: |
          if [[ -n "$TRI_GOOGLE_SERVICE_ACCOUNT_JSON" && -n "$TRI_CLOUDFLARE_ACCOUNT_ID" && -n "$TRI_R2_ACCESS_KEY_ID" && -n "$TRI_R2_SECRET_ACCESS_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TRI_AUTO_SYNC_DISABLED: one-time Drive and Cloudflare R2 secrets are not configured"
          fi
      - name: Install private sync client libraries
        if: steps.credentials.outputs.ready == 'true'
        run: pip install --disable-pip-version-check --quiet google-auth requests boto3
      - name: Sync the most recent certified prescratch scorer package
        if: steps.credentials.outputs.ready == 'true'
        run: python scripts/tri_dashboard_sync.py --source-file-id "$TRI_SOURCE_FILE_ID"
