name: Pulse three real qualified candidates — browser preview
on:
  push:
    branches:
      - feature/race-day-pulse-v1
    paths:
      - 'research/pulse/2026-11-26-candidate-preview.json'
      - 'test-pulse-source-preview-browser.mjs'
      - 'public/index.html'
      - 'public/assets/race-day-pulse.css'
      - 'public/assets/race-day-pulse.js'
      - '.github/workflows/pulse-three-example-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render sourced examples
        run: node test-pulse-source-preview-browser.mjs
      - name: Preserve owner review PNG previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-three-real-example-previews
          path: pulse-source-preview/*.png
          if-no-files-found: ignore
