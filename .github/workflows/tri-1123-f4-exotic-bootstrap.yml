name: TRI Nov 23 — Ephemeral F4 Exotic Encryption Key
on:
  push:
    branches: [main]
    paths: ['ops/tri-1123-f4-exotic-bootstrap.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private R2 encrypted-transfer dependencies
        run: python -m pip install --quiet --disable-pip-version-check boto3 brotli cryptography
      - name: Prepare ephemeral RSA key inside private R2
        run: python scripts/tri_1123_f4_exotics_delivery.py bootstrap
