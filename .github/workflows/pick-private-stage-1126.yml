name: Stage verified November 26 Pick Tickets for 3AM Eastern
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pick-private-stage-1126.yml']
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: pick-private-stage-1126
  cancel-in-progress: false
jobs:
  public-key:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Public encryption key only
        env:
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_private_score_bridge.py public-key
  stage:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 183 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_PICK_STAGE_1126_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Validate approved scores and stage dated Pick Tickets only
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_private_stage_1126.py
      - if: always()
        run: rm -f /tmp/rr-pick-stage-1126.json
