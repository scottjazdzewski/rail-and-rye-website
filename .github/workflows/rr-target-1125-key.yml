name: Private Target List transfer public key for Nov27
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rr-target-1125-key.yml']
permissions:
  contents: read
jobs:
  publish-public-key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pynacl==1.5.0
      - name: Print only the public encryption key
        env:
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          from scripts.target_list_private_review_bridge import private_key
          import base64
          print('TARGET_1125_ENCRYPTION_PUBLIC_KEY='+base64.b64encode(bytes(private_key().public_key)).decode())
          PY
