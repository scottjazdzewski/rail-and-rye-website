name: Premium Pulse staging browser QA
on:
  push:
    branches: [feature/race-day-pulse-v1]
    paths:
      - 'test-pulse-premium-preview.mjs'
      - 'staging/pulse-preview-worker.js'
      - 'public/assets/race-day-pulse.*'
      - '.github/workflows/verify-pulse-premium-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: node test-pulse-premium-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-pulse-preview
          path: pulse-premium-preview/*.png
          if-no-files-found: ignore
