name: November 27 Pick Tickets independent verified release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pick-release-1127.yml'
      - 'scripts/pick_release_1127.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pick-release-1127
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pynacl==1.5.0 boto3==1.40.36
      - run: node test-pick-stage-inventory.mjs && node test-pick-tickets-v34.mjs && node test-pick-tickets-sqr.mjs && node test-pick-tickets-customer-pwin.mjs
      - name: Validate encrypted source and publish current-date verified Pick Tickets
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_release_1127.py
      - if: always()
        run: rm -f /tmp/rr-pick-1127-*.json
