name: Preserve verified November 28 Pulse baselines
on:
  push:
    branches: [feature/race-day-pulse-v1]
    paths: ['scripts/preserve-pulse-1128-stage.py','.github/workflows/pulse-1128-originals.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-1128-originals
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/feature/race-day-pulse-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.36
      - name: Verify and preserve exact original bytes privately
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/preserve-pulse-1128-stage.py
