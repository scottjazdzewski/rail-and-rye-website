name: TRI Nov 23 — patch exact 367 verified F4 display ranks into private R2
on:
  push:
    branches: [main]
    paths: ['secure-transfer/tri-20261123-f4-ranks.sealed.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install approved encrypted-R2 dependencies
        run: python -m pip install --quiet --disable-pip-version-check boto3 cryptography brotli
      - name: Authenticate, verify complete F4 rank receipt, patch R2 and read back
        run: python scripts/tri_1123_verified_f4_rank_r2.py publish --sealed-file secure-transfer/tri-20261123-f4-ranks.sealed.json
