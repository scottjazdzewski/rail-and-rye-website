name: Verify housed TRI output for Pulse (read-only)
on:
  push:
    branches: [feature/race-day-pulse-v1]
    paths:
      - 'scripts/audit-pulse-engine-output.py'
      - 'src/race-day-pulse.js'
      - '.github/workflows/audit-pulse-engine-output.yml'
  pull_request:
    paths: ['src/race-day-pulse.js','.github/workflows/audit-pulse-engine-output.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare certified original and revised engine artifacts
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
          PULSE_ENGINE_AUDIT_DATES: '2026-11-26,2026-11-27'
        run: |
          python -m pip install --quiet boto3
          python scripts/audit-pulse-engine-output.py
