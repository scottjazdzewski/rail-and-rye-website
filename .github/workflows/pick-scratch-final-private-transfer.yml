name: Private Pick Tickets scratch-final TRI and F4 transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pick-scratch-final-private-transfer.yml'
      - 'scripts/pick_scratch_final_private_transfer.py'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  trusted-public-key:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto and private R2 client
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Print public sealing key only
        env:
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_scratch_final_private_transfer.py public-key
  private-r2-ingest:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 202 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_PICK_SCRATCH_FINAL_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned private transfer dependencies
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Verify sealed original TRI/F4 scores and save certified current private tickets
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_scratch_final_private_transfer.py ingest
