name: Race-Day Pulse real-candidate preview (read-only)
on:
  push:
    branches:
      - feature/race-day-pulse-v1
    paths:
      - 'scripts/race_day_pulse_customer_example_audit.py'
      - '.github/workflows/verify-pulse-customer-examples.yml'
permissions:
  contents: read
jobs:
  readonly-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only compare original and certified current dashboards
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install --quiet boto3
          python scripts/race_day_pulse_customer_example_audit.py
