name: November 27 Churchill Pick Tickets parity and final verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-pick-scratch-cd-1127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet boto3==1.40.36
      - name: Verify all 15 customer objects, new revisions and actual catalog
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/verify_pick_scratch_cd_1127.py
      - if: always()
        run: rm -f /tmp/rr-pick-1127-current-reader.json
