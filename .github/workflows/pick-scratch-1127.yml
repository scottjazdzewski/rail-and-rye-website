name: November 27 Pick Tickets certified Tampa Laurel Parx scratch release
on:
  push:
    branches: [main]
    paths: ['scripts/pick_scratch_1127.py','.github/workflows/pick-scratch-1127.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pick-scratch-1127
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - run: node test-pick-tickets-v34.mjs && node test-pick-tickets-sqr.mjs && node test-pick-tickets-customer-pwin.mjs
      - name: Rebuild from verified scratch-final source and publish exact customer revisions
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_scratch_1127.py
      - if: always()
        run: rm -f /tmp/rr-pick-1127-*.json
