name: Correct November 25 queued Pick Tickets conditional fields
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  stage:
    if: github.event.issue.number == 183 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_PICK_STAGE_1125_QA_V2')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Verify and replace only the four scheduled customer editions
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_stage_qa_1125_v2.py
      - if: always()
        run: rm -f /tmp/rr-pick-qa-v2-input.json /tmp/rr-pick-qa-v2-output.json
