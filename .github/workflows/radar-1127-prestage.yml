name: November 27 Longshot Radar private prestage and exact-source gate
on:
  push:
    branches: [main]
    paths: ['private-ingest/20261127/radar-prestage.enc','private-ingest/20261127/manifest.json']
  workflow_dispatch:
  schedule:
    - cron: '17,47 19-23 26 11 *'
    - cron: '17,47 0-7 27 11 *'
permissions:
  contents: read
concurrency:
  group: radar-1127-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Private pre-stage and guarded final stage only on full source parity
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/radar_1127_prestage.py
