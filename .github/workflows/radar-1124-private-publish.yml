name: Transfer reviewed Nov24 Radar to private R2
on:
  pull_request:
    paths:
      - 'scripts/radar_1124_private_publish.py'
      - '.github/workflows/radar-1124-private-publish.yml'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-only review, never access R2 from untrusted PR
        run: python -m py_compile scripts/radar_1124_private_publish.py
  sealed-publish:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 0 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_RADAR_1124_PRIVATE_APPROVED_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked sealed transfer and private R2 clients
        run: python -m pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Decrypt owner review; verify 6 complete frozen TRI fields and editorial; write R2 + readback
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/radar_1124_private_publish.py
