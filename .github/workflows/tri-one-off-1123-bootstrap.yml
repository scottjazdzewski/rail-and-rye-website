name: TRI November 23 — provision private one-time transfer key
on:
  push:
    branches: [main]
    paths: ['ops/tri-1123-bootstrap.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption and Cloudflare R2 client
        run: pip install --disable-pip-version-check --quiet cryptography boto3
      - name: Provision one-time RSA public key; private stays inside R2
        run: python scripts/tri_one_off_secure_delivery.py bootstrap
