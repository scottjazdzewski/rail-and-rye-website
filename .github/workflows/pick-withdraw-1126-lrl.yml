name: Withdraw canceled November 26 Laurel Pick Tickets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pick-withdraw-1126-lrl.yml'
permissions:
  contents: read
concurrency:
  group: pick-withdraw-1126-lrl
  cancel-in-progress: false
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install boto3==1.40.36
      - name: Verify canceled sequences, preserve prior edition, withdraw approval and verify readback
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_withdraw_1126_lrl.py
      - if: always()
        run: rm -f /tmp/rr-lrl-withdraw.json
