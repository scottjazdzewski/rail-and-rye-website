name: Private Nov 23 Pick Tickets source handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pick-private-score-transfer.yml'
      - 'scripts/pick_private_score_bridge.py'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  public-key:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sealed-box crypto and R2 client
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Public encryption key for private prescratch review
        env:
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_private_score_bridge.py public-key
      - name: Audit private R2 November 23 projection source presence
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_private_score_bridge.py status
      - uses: actions/upload-artifact@v4
        with:
          name: pick-private-review-public-key
          path: pick-private-review-public-key.txt
          retention-days: 1
  encrypted-ingest:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 183 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_PICK_PRIVATE_SCORES_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto and R2 clients
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Decrypt owner-authorized review scores and read-back check private R2
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_private_score_bridge.py ingest
