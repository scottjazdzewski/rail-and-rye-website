name: November 27 Pick Tickets owner authorized single protection review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pick-protection-1127.yml','scripts/review_pick_protection_1127.mjs','scripts/pick_protection_1127.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pick-protection-1127
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet boto3==1.40.36
      - run: node scripts/review_pick_protection_1127.mjs --test && node test-pick-tickets-v34.mjs && node test-pick-tickets-sqr.mjs && node test-pick-tickets-customer-pwin.mjs
      - name: Current source review, immutable archive, and guarded customer publication
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/pick_protection_1127.py
      - if: always()
        run: rm -f /tmp/pick-protection-*.json /tmp/rr-pick-1127-current-reader.json
