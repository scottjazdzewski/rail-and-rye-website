name: TRI November 23 — temporary verified badge transfer key
on:
  push:
    branches: [main]
    paths: ['ops/tri-1123-badge-bootstrap.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encrypted R2 clients
        run: python -m pip install --quiet --disable-pip-version-check boto3 cryptography brotli
      - name: Provision temporary RSA public key without logging private key
        run: python scripts/tri_1123_verified_badge_patch.py bootstrap
