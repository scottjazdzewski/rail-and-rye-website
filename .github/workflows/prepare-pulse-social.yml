name: Prepare approved Pulse social cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wrangler.jsonc','src/race-day-pulse.js','public/assets/race-day-pulse.js','scripts/render-pulse-social.mjs','.github/workflows/prepare-pulse-social.yml']
  schedule:
    - cron: '*/15 0-7,13-23 * * *'
permissions:
  contents: read
concurrency:
  group: pulse-social-publication
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main' && vars.PULSE_SOCIAL_RELEASE_APPROVED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public feed for newly certified missing images
        id: feed
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            expected=$(sha256sum public/assets/race-day-pulse.js | cut -d' ' -f1)
            ready=0
            for attempt in $(seq 1 20); do
              live=$(curl -fsS "https://railandryeracing.com/assets/race-day-pulse.js?verify=$GITHUB_SHA-$attempt" | sha256sum | cut -d' ' -f1)
              if [ "$live" = "$expected" ]; then ready=1; break; fi
              sleep 10
            done
            test "$ready" = 1
          fi
          for attempt in $(seq 1 20); do
            if curl -fsS 'https://railandryeracing.com/api/race-day-pulse' -o /tmp/pulse-feed.json; then
              if [ "$GITHUB_EVENT_NAME" != push ] || node -e "const f=require('/tmp/pulse-feed.json');process.exit(f.status==='ok'?0:1)"; then break; fi
            fi
            sleep 10
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('/tmp/pulse-feed.json','utf8'));
          if(f.status==='disabled'){fs.appendFileSync(process.env.GITHUB_OUTPUT,'missing=0\n');process.exit(0);}
          if(f.status!=='ok'||!Array.isArray(f.items)||f.preview)throw Error('Public feed unavailable');
          if(f.date<JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')).vars.PULSE_PUBLICATION_START_DATE)throw Error('Before approved first racing day');
          const missing=[];
          for(const item of f.items){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(item.date)||item.date!==f.date||!/^[-a-z0-9]{2,120}$/.test(item.id)||item.id.startsWith('demo-'))throw Error('Unexpected public item');
            const response=await fetch('https://railandryeracing.com/pulse/'+item.date+'/'+item.id+'/card-v1.png',{method:'HEAD'});
            if(response.status===404)missing.push(item);
            else if(!response.ok||!response.headers.get('content-type')?.startsWith('image/png'))throw Error('Unexpected image response '+response.status);
          }
          fs.writeFileSync('/tmp/pulse-feed.json',JSON.stringify({...f,items:missing}));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'missing='+missing.length+'\n');
          JS
      - name: Render only new public insights
        if: steps.feed.outputs.missing != '0'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p /tmp/pulse-social
          node scripts/render-pulse-social.mjs --feed /tmp/pulse-feed.json --out /tmp/pulse-social
      - name: Publish immutable PNGs with authenticated conditional creation
        if: steps.feed.outputs.missing != '0'
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install --quiet boto3==1.40.36
          python - <<'PY'
          import boto3, os, re, struct, pathlib, urllib.request, time
          from botocore.exceptions import ClientError
          root=pathlib.Path('/tmp/pulse-social')
          client=boto3.client('s3',region_name='auto',endpoint_url='https://'+os.environ['TRI_CLOUDFLARE_ACCOUNT_ID']+'.r2.cloudflarestorage.com',aws_access_key_id=os.environ['TRI_R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['TRI_R2_SECRET_ACCESS_KEY'])
          def valid(b):
              return len(b)>=33 and len(b)<2_000_000 and b[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',b[16:24])==(1200,675)
          for file in root.rglob('*.png'):
              date,id=file.parent.name,file.stem
              assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',date) and re.fullmatch(r'[a-z0-9-]{2,120}',id) and not id.startswith('demo-')
              data=file.read_bytes()
              assert valid(data)
              page='https://railandryeracing.com/pulse/'+date+'/'+id
              image=page+'/card-v1.png'
              with urllib.request.urlopen(page,timeout=20) as response: assert response.status==200
              try:
                  client.put_object(Bucket='rail-and-rye-private-cards',Key='race-day-pulse/social/v1/'+date+'/'+id+'.png',Body=data,ContentType='image/png',CacheControl='public, max-age=86400, immutable',IfNoneMatch='*')
              except ClientError as e:
                  if e.response['ResponseMetadata']['HTTPStatusCode']!=412: raise
              with urllib.request.urlopen(image,timeout=20) as response: assert valid(response.read()) and response.headers.get_content_type()=='image/png'
              for attempt in range(6):
                  with urllib.request.urlopen(page+'?verify='+str(time.time_ns()),timeout=20) as response:
                      html=response.read().decode()
                  if 'summary_large_image' in html and image in html: break
                  time.sleep(5)
              else: raise RuntimeError('Missing social metadata: '+page)
              print('Verified',date,id)
          PY
