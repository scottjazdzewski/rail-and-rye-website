name: Publish certified November 24 initial TRI F4 to private Cloudflare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rr-1124-initial-private-publish.yml'
      - 'private-ingest/1124-initial.enc.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rr-20261124-prescratch-initial-private
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create private encrypted transfer or publish signed initial cards and F4
        run: |
          python -m pip install --disable-pip-version-check --quiet boto3 cryptography
          python scripts/rr_1124_prescratch_private_publish.py
