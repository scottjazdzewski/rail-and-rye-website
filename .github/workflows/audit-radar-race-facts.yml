name: Audit actual Radar race facts in private source
on:
  push:
    branches: [main]
    paths:
      - 'src/longshot-radar.js'
      - 'scripts/check_radar_race_facts_coverage.py'
      - '.github/workflows/audit-radar-race-facts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-race-facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only source coverage for the real November 23 Radar
        run: |
          python -m pip install --disable-pip-version-check boto3==1.40.36
          python scripts/check_radar_race_facts_coverage.py
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
