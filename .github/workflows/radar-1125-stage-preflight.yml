name: November 25 Radar private staging preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/radar-1125-stage-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Derive public transfer key, verify staged source and print only aggregate readiness
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/pick_private_score_bridge.py public-key
          python scripts/verify_1125_stage_readonly.py
