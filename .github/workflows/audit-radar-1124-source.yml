name: Nov 24 Radar scored-source preflight
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_radar_20261124_source.py'
      - '.github/workflows/audit-radar-1124-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-score-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source availability without modifying model or private storage
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip -q install boto3==1.40.36
          python scripts/audit_radar_20261124_source.py
