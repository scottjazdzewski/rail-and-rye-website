name: Check Target List private preview on live domain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-target-list-live-preview.yml'
      - 'public/assets/target-list-dashboard.js'
      - 'public/assets/target-list-dashboard.css'
      - 'public/admin/target-list-preview.html'
      - 'src/target-list.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production domain serves Target List private review code
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            url="https://railandryeracing.com/assets/target-list-dashboard.js?rr_review_check=${GITHUB_SHA}-${attempt}-$(date +%s)"
            code=$(curl -L -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -w '%{http_code}' -o /tmp/target-list-live.js "$url" || true)
            echo "Production asset probe attempt $attempt: HTTP $code"
            if [ "$attempt" -eq 1 ]; then
              for marker in '/api/admin/target-list-review' 'const tote=value' 'rr-target-runner-info' 'rr-target-analyze'; do
                if grep -Fq "$marker" /tmp/target-list-live.js; then echo "Live JS marker $marker = yes"; else echo "Live JS marker $marker = no"; fi
              done
              echo "Live JS first line: $(head -n 1 /tmp/target-list-live.js | cut -c 1-120)"
            fi
            if [ "$code" = '200' ] && grep -Fq '/api/admin/target-list-review' /tmp/target-list-live.js &&
               grep -Fq 'const tote=value' /tmp/target-list-live.js &&
               grep -Fq 'rr-target-runner-info' /tmp/target-list-live.js &&
               ! grep -Eq 'DEMO_EXAMPLE|Sample Favorite|Example Downs|rr-target-local-file|rr-target-analyze|rr-target-upload-form|rr-target-file' /tmp/target-list-live.js; then
              echo 'LIVE_PREVIEW_DEPLOYED: Actual private R2 daily reader is live, with no synthetic horses or local-file loader.'
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'LIVE_PREVIEW_NOT_VERIFIED: Current site does not serve the private review module.'
              exit 1
            fi
            sleep 8
          done
          cssurl="https://railandryeracing.com/assets/target-list-dashboard.css?rr_layout_check=${GITHUB_SHA}-$(date +%s)"
          csscode=$(curl -L -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -w '%{http_code}' -o /tmp/target-list-live.css "$cssurl" || true)
          test "$csscode" = '200'
          grep -Fq 'Target List v3' /tmp/target-list-live.css
          grep -Fq -- '-webkit-line-clamp:unset' /tmp/target-list-live.css
          grep -Fq 'Readable editorial:' /tmp/target-list-live.css
          grep -Fq 'font:500 15px/1.55 Inter' /tmp/target-list-live.css
          ! grep -Fq 'rr-target-publisher' /tmp/target-list-live.css
          echo 'LIVE_TARGET_READABLE_V4: full 15px editorial analysis, compact rows and no JSON uploader.'
          protected=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' 'https://railandryeracing.com/api/admin/target-list-review' || true)
          echo "Unauthenticated private data endpoint: HTTP $protected"
          case "$protected" in
            301|302|303|307|308|401|403|404|503) ;;
            *) echo 'ERROR: Private data endpoint must not be publicly readable.'; exit 1 ;;
          esac
