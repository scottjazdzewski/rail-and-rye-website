name: Verify Racing Wire only
on:
  pull_request:
    paths:
      - 'public/preview/racing-wire-5333548f0ffee31ba519b2470ffb/**'
      - 'test-racing-wire.mjs'
      - 'src/racing-wire.js'
      - 'src/index.js'
      - '.github/workflows/verify-racing-wire-only.yml'
jobs:
  racing-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-sqlite test-racing-wire.mjs
