name: Verify mobile race fact badges
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/projections-dashboard.js'
      - 'public/assets/projections-dashboard.css'
      - 'public/assets/rr-race-facts.css'
      - 'public/admin/projections-preview.html'
      - 'public/membership/dashboard/index.html'
      - 'test-projection-race-facts-browser.mjs'
      - '.github/workflows/verify-projection-race-facts-mobile.yml'
  pull_request:
    paths:
      - 'public/assets/projections-dashboard.js'
      - 'public/assets/projections-dashboard.css'
      - 'public/assets/rr-race-facts.css'
      - 'public/admin/projections-preview.html'
      - 'public/membership/dashboard/index.html'
      - 'test-projection-race-facts-browser.mjs'
      - '.github/workflows/verify-projection-race-facts-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-facts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original race data and centered badge asset references
        run: node test-projection-dashboard-mobile.mjs
      - name: Install headless mobile browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Verify badges at 320 360 375 390 and 430px
        run: node test-projection-race-facts-browser.mjs
      - name: Save five mobile snapshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rail-rye-mobile-race-facts
          path: test-artifacts/race-facts-mobile-*.png
          if-no-files-found: ignore
