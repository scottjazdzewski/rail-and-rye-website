name: Verify private Longshot Radar module
on:
  pull_request:
    paths:
      - "src/longshot-radar.js"
      - "src/index.js"
      - "public/admin/longshot-radar.html"
      - "public/assets/longshot-radar.*"
      - "test-longshot-radar.mjs"
      - "tests/longshot-radar-browser.mjs"
      - ".github/workflows/verify-longshot-radar.yml"
  push:
    branches:
      - "feature/racing-hub-longshot-radar-private-review"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and contract tests
        run: |
          node --check src/longshot-radar.js
          node --check src/index.js
          node --check public/assets/longshot-radar.js
          node test-longshot-radar.mjs
      - name: Install browser for responsive QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check real browser viewports and drawer
        run: node tests/longshot-radar-browser.mjs
      - name: Capture private synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longshot-radar-review-screens
          path: test-artifacts/longshot-*.png
          if-no-files-found: ignore
