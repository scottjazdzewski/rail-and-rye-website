name: Verify November 27 scheduled stage and current edition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-1127-stage-queue.yml'
      - 'scripts/verify_1127_stage_queue.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_rr_explicit_double_reader.mjs
      - run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Verify live stage and release queue
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/verify_1127_stage_queue.py
