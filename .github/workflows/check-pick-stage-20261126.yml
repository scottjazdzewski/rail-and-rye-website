name: Read-only verify November 26 Pick Tickets release queue
on:
  push:
    branches: [research/pick-stage-check-20261126]
    paths: ['.github/workflows/check-pick-stage-20261126.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.36
      - name: Verify scheduled receipt, customer checksums, and public cutoff
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os,json,hashlib,boto3,time,re,urllib.request
          from botocore.exceptions import ClientError
          s=boto3.client("s3",endpoint_url="https://"+os.environ["TRI_CLOUDFLARE_ACCOUNT_ID"].strip()+".r2.cloudflarestorage.com",region_name="auto",aws_access_key_id=os.environ["TRI_R2_ACCESS_KEY_ID"].strip(),aws_secret_access_key=os.environ["TRI_R2_SECRET_ACCESS_KEY"].strip())
          b="rail-and-rye-private-cards";d="2026-11-26";root=f"pick-tickets/staging/{d}/";due="2026-11-26T08:00:00Z";expected="93c7c84ab1f40496d5101f6f1b7f3a7129b21c6bb26d7944011e73c67d24af05"
          def get(k):
              o=s.get_object(Bucket=b,Key=k);return o["Body"].read(),o.get("Metadata",{})
          sha=lambda x:hashlib.sha256(x).hexdigest()
          raw,m=get(root+"revision-0001.json");assert sha(raw)==expected==m["sha256"] and m["stage_only"]=="true"
          stage=json.loads(raw);assert stage["release_at"]==due and len(stage["tracks"])==6
          for i in range(18):
              try:q=json.loads(get(root+"prepared-0001.json")[0]);break
              except ClientError as e:
                  if e.response.get("Error",{}).get("Code") not in ("NoSuchKey","404","NotFound"):raise
                  print("WAITING_FOR_PREPARED_RECEIPT",i,flush=True);time.sleep(5)
          else:raise RuntimeError("Prepared receipt not yet present")
          assert q["sha256"]==expected and q["release_at"]==due and len(q["tracks"])==6
          assert all(t.get("product_id") and t.get("release_at")=="2026-11-26 08:00:00" for t in q["tracks"])
          total=0
          for t in q["tracks"]:
              tr=t["track"];slug=re.sub("[^a-z0-9]+","-",tr.lower()).strip("-")
              raw,m=get(f"racing-intelligence/product-tabs/pick-tickets/{d}/{slug}.json");card=json.loads(raw)
              assert card["track"]==tr and card["date"]==d and m["customer_publish_approved"]=="true" and m["staged_release_at"]==due and sha(raw)==m["content_sha256"]
              assert len(card["sequences"])==t["sequence_count"] and all(s["review_probabilities"] and len(s["race_fields"])==len(s["review_probabilities"]) for s in card["sequences"])
              total+=len(card["sequences"]);print("PICK_QUEUE_TRACK_PASS",tr,len(card["sequences"]),flush=True)
          assert total==78
          with urllib.request.urlopen(urllib.request.Request("https://railandryeracing.com/api/products?qa=pick-nov26-stage",headers={"Cache-Control":"no-cache","User-Agent":"RailRyeReleaseQA/1"}),timeout=20) as response:products=json.load(response)["products"]
          rows=products+[x for p in products for x in p.get("included_products",[])]
          assert not any(p.get("race_date")==d for p in rows)
          today={p.get("track") for p in rows if p.get("category")=="Pick Tickets" and p.get("race_date")=="2026-11-25" and p.get("track")}
          assert len(today)==9
          print("PICK_QUEUE_FINAL_PASS tracks=6 sequences=78 current_tracks=9 release_at="+due,flush=True)
          import urllib.request
          root="pick-tickets/staging/2026-11-26/"
          def get(k):
              o=s.get_object(Bucket=b,Key=k);raw=o["Body"].read();return json.loads(raw),o.get("Metadata",{}),hashlib.sha256(raw).hexdigest()
          stage,m,digest=get(root+"revision-0001.json")
          assert m.get("sha256")==digest and m.get("stage_only")=="true" and stage.get("release_at")=="2026-11-26T08:00:00Z"
          print("PICK_1126_STAGE_VERIFIED",json.dumps({"sha256":digest,"tracks":len(stage["tracks"]),"races":sum(r["races"] for r in stage["tracks"]),"runners":sum(r["runners"] for r in stage["tracks"]),"sequences":sum(len(r["card"]["sequences"]) for r in stage["tracks"]),"canonical_snapshot_rows":sum(bool(r.get("canonical_source")) for r in stage["tracks"])}))
          from botocore.exceptions import ClientError
          try:
              q,_,_=get(root+"prepared-0001.json")
          except ClientError as e:
              if e.response.get("Error",{}).get("Code") not in ("NoSuchKey","404","NotFound"):raise
              print("PICK_1126_CATALOG_NOT_PREPARED")
          else:
              assert q["sha256"]==digest and q["release_at"]==stage["release_at"] and len(q["tracks"])==6
              assert all(t["release_at"]=="2026-11-26 08:00:00" and t["product_id"] for t in q["tracks"])
              for t in q["tracks"]:
                  slug=t["track"].lower().replace(" ","-")
                  c,cm,ch=get("racing-intelligence/product-tabs/pick-tickets/2026-11-26/"+slug+".json")
                  assert cm["content_sha256"]==ch and cm["customer_publish_approved"]=="true" and len(c["sequences"])==t["sequence_count"] and all(x.get("review_probabilities") for x in c["sequences"])
              print("PICK_1126_CATALOG_VERIFIED",json.dumps({"tracks":len(q["tracks"]),"sequences":sum(t["sequence_count"] for t in q["tracks"]),"release_at":q["release_at"],"prepared_at":q["prepared_at"]}))
          req=urllib.request.Request("https://railandryeracing.com/api/products?qa=pick-stage-1126",headers={"Cache-Control":"no-cache","User-Agent":"RailRyeReleaseQA/1"})
          with urllib.request.urlopen(req,timeout=20) as response: ps=json.load(response)["products"]
          rows=ps+[i for p in ps for i in p.get("included_products",[])]
          today={p.get("track") for p in rows if p.get("category")=="Pick Tickets" and p.get("race_date")=="2026-11-25" and p.get("track")}
          tomorrow={p.get("track") for p in rows if p.get("category")=="Pick Tickets" and p.get("race_date")=="2026-11-26" and p.get("track")}
          print("PICK_1126_PUBLIC_CUTOFF",json.dumps({"today_tracks":len(today),"tomorrow_visible":len(tomorrow)}))
          assert len(today)==9 and not tomorrow
          PY
