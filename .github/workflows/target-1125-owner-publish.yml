name: Publish source-verified Nov25 Target List privately
on:
  push:
    branches: [main]
    paths: ['private-ingest/20261125/target.enc', 'scripts/target_1125_owner_publish.py']
permissions:
  contents: read
concurrency:
  group: target-1125-owner-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Validate complete staged TRI source, seven handicapping approvals and customer readback
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/target_1125_owner_publish.py
