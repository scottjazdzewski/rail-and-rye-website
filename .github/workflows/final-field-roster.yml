name: Final field roster regression
on:
  push:
    branches: [main]
    paths:
      - scripts/verify_final_field_roster.py
      - .github/workflows/final-field-roster.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_final_field_roster.py --self-test
