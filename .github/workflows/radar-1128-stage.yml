name: November 28 Longshot Radar independent verified staging and parity gate
on:
  push:
    branches: [main]
    paths: ['private-ingest/20261128/radar-stage.enc']
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 0-7 28 11 *'
permissions:
  contents: read
concurrency:
  group: radar-1128-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pynacl==1.5.0 boto3==1.40.36
      - name: Verify and stage complete independent Radar edition, gate scheduled release
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/radar_1128_stage.py
