name: Verify production Pulse deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pulse-live-release.yml'
      - 'src/race-day-pulse.js'
      - 'public/assets/race-day-pulse.js'
      - 'public/index.html'
      - 'wrangler.jsonc'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-live-release-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact live homepage assets and guarded public feed
        run: |
          python - <<'PY'
          import urllib.request,json,re,time,hashlib
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          base='https://railandryeracing.com'
          expected=Path('public/assets/race-day-pulse.js').read_bytes()
          config=json.loads(Path('wrangler.jsonc').read_text())['vars']
          start=config['PULSE_PUBLICATION_START_DATE']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'RailRyeReleaseQA/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.read()
          for attempt in range(16):
              try:
                  bust='?release_qa='+str(time.time_ns())
                  home=get('/'+bust).decode()
                  assert 'id="rr-pulse"' in home and 'race-day-pulse.js?v=11' in home
                  live=get('/assets/race-day-pulse.js'+bust)
                  assert hashlib.sha256(live).digest()==hashlib.sha256(expected).digest()
                  f=json.loads(get('/api/race-day-pulse'+bust))
                  now=datetime.now(ZoneInfo('America/New_York'))
                  date=(now.date()-timedelta(days=now.hour<3)).isoformat()
                  assert f['date']==date and isinstance(f['items'],list)
                  if config['PULSE_PUBLICATION_ENABLED']!='true' or date<start:assert f['status']=='disabled' and not f['items']
                  else:
                      assert f['status']=='ok'
                      if date=='2026-11-27':assert len(f['items'])>0
                      assert all(i['date']==date and not i['id'].startswith('demo-') for i in f['items'])
                      if f['items']:
                          i=f['items'][0]
                          detail=get('/pulse/'+i['date']+'/'+i['id']+bust).decode()
                          assert 'Race-Day Pulse' in detail and 'model_receipts' not in detail
                  print('PULSE_LIVE_DEPLOYMENT_VERIFIED',json.dumps({'date':date,'status':f['status'],'insights':len(f['items']),'renderer_sha256':hashlib.sha256(live).hexdigest()}),flush=True)
                  break
              except Exception as e:
                  print('Readback attempt',attempt+1,type(e).__name__,flush=True)
                  if attempt==15:raise
                  time.sleep(10)
          PY
