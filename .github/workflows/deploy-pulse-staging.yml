name: Deploy isolated Pulse staging
on:
  push:
    branches: [feature/race-day-pulse-v1]
    paths:
      - 'staging/pulse-preview-worker.js'
      - 'wrangler.pulse-preview.jsonc'
      - 'public/assets/race-day-pulse.*'
      - '.github/workflows/deploy-pulse-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-pulse-staging
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/race-day-pulse-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview isolation
        run: |
          node --check staging/pulse-preview-worker.js
          node --check public/assets/race-day-pulse.js
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('wrangler.pulse-preview.jsonc'));if(c.name!=='rail-and-rye-pulse-staging'||c.main!=='staging/pulse-preview-worker.js'||Object.keys(c).some(k=>!['name','main','compatibility_date','workers_dev','assets'].includes(k))||c.assets.run_worker_first!==true)throw Error('Unsafe staging config')"
      - name: Deploy only the separate staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are not available to this workflow. No deployment attempted."
            exit 1
          fi
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler.pulse-preview.jsonc 2>&1 | tee deploy-result.txt
          url=$(grep -Eo 'https://rail-and-rye-pulse-staging\.[a-zA-Z0-9.-]+\.workers\.dev' deploy-result.txt | head -1 || true)
          if [ -z "$url" ]; then echo "::error::No staging URL reported"; exit 1; fi
          curl -fsS --retry 3 "$url/" | grep -q 'DESIGN PREVIEW'
          curl -fsS --retry 3 "$url/api/race-day-pulse" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.preview!==true||x.items.length!==4||x.items.some(i=>!i.id.startsWith('demo-')))process.exit(1)})"
          printf 'Verified staging URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
