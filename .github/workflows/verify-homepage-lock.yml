name: Verify approved homepage lock
on:
  pull_request:
    paths:
      - 'public/**'
      - 'test-homepage-lock.mjs'
      - 'test-projection-dashboard-mobile.mjs'
      - 'test-prescratch-projection-import.mjs'
      - 'src/projections.js'
      - 'scripts/tri_dashboard_sync.py'
      - 'tests/test_tri_dashboard_sync.py'
      - 'scripts/tri_one_off_secure_delivery.py'
      - 'tests/test_tri_one_off_secure_delivery.py'
      - '.github/workflows/tri-one-off-1123-bootstrap.yml'
      - '.github/workflows/tri-one-off-1123-import.yml'
      - '.github/workflows/verify-homepage-lock.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'test-homepage-lock.mjs'
      - 'test-prescratch-projection-import.mjs'
      - 'src/projections.js'
      - 'scripts/tri_dashboard_sync.py'
      - 'tests/test_tri_dashboard_sync.py'
      - '.github/workflows/verify-homepage-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Homepage visual baseline and asset integrity
        run: node test-homepage-lock.mjs
      - name: Dashboard projection and mobile data regression
        run: node test-projection-dashboard-mobile.mjs
      - name: Prescratch TRI F4 model roundtrip and release-label guard
        run: node test-prescratch-projection-import.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TRI direct-to-R2 model receipt and overwrite tests
        run: python -m unittest discover -s tests -p 'test_tri_dashboard_sync.py' -v
      - name: One-time encrypted private R2 delivery regression
        run: |
          python -m pip install --quiet --disable-pip-version-check boto3 cryptography
          python -m unittest discover -s tests -p 'test_tri_one_off_secure_delivery.py' -v
