name: Repair November 27 Zia race 10 post time and verify selector
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-1127-zia-post-time.yml']
permissions:
  contents: read
concurrency:
  group: rr-1127-zia-metadata-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet boto3==1.40.36
      - name: Guarded metadata correction and public catalog readback
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os,boto3,json,hashlib,copy,subprocess,urllib.request,time
          from datetime import datetime,timezone
          s=boto3.client('s3',endpoint_url='https://'+os.environ['TRI_CLOUDFLARE_ACCOUNT_ID'].strip()+'.r2.cloudflarestorage.com',region_name='auto',aws_access_key_id=os.environ['TRI_R2_ACCESS_KEY_ID'].strip(),aws_secret_access_key=os.environ['TRI_R2_SECRET_ACCESS_KEY'].strip())
          b='rail-and-rye-private-cards';date='2026-11-27';key='projections/dashboard/'+date+'/zia-park.json';fk='projections/f4-ordered/'+date+'/zia-park.json';parent='aa175041e3bfa9ad15616d49934a0894a8f19d7fbd1b54294d4c30f4585aa1d8'
          def get(k):
            x=s.get_object(Bucket=b,Key=k);return x['Body'].read(),x.get('Metadata',{})
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def compact(x):return json.dumps(x,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          raw,meta=get(key);fraw,fmeta=get(fk);c=json.loads(raw);f=json.loads(fraw)
          assert c['race_date']==date and c['track_name']=='Zia Park' and c['projection_status']=='scratch_final' and c['scratch_release_sha256']==f['scratch_release_sha256']==parent
          assert len(c['races'])==10 and sum(len(r['entries']) for r in c['races'])==79 and sum(len(r['scratches']) for r in c['races'])==4
          r=next(r for r in c['races'] if r['race_number']==10)
          assert r['post_time_et']=='2nd Half Late Daily Double /$1 Exacta / .50'
          repaired=copy.deepcopy(c);next(r for r in repaired['races'] if r['race_number']==10)['post_time_et']='6:08 PM'
          raw2=compact(repaired)
          js="""import {readMemberProjectionCards} from './src/projections.js';import {verifyCertifiedScratchFinalTrack} from './src/f4-exotics.js';import {requireProductionPurses,requireProductionStakesNames} from './src/projection-race-information.js';let s='';for await(const x of process.stdin)s+=x;const {card,model}=JSON.parse(s);requireProductionPurses(card);requireProductionStakesNames(card);if(!verifyCertifiedScratchFinalTrack(card,model))throw Error('F4 gate');const k='projections/dashboard/2026-11-27/zia-park.json';const env={CARDS_BUCKET:{list:async()=>({objects:[{key:k}]}),get:async key=>key===k?{text:async()=>JSON.stringify(card)}:null}};const rows=await readMemberProjectionCards(env,[]);if(rows.length!==1||rows[0].track!=='Zia Park'||rows[0].card.races.find(r=>r.race_number===10).post_time_et!=='6:08 PM')throw Error('Member reader rejected corrected card');console.log('ZIA_MEMBER_READER_PREFLIGHT_PASS');"""
          subprocess.run(['node','--input-type=module','-e',js],input=compact({'card':repaired,'model':f}),check=True)
          assert get(key)[0]==raw and get(fk)[0]==fraw,'Concurrent update'
          # Keep all scores, scratch lineage, F4 and publication authorization exactly as before.
          s.put_object(Bucket=b,Key=key,Body=raw2,ContentType='application/json',CacheControl='private,no-store',Metadata=meta)
          assert get(key)[0]==raw2 and get(fk)[0]==fraw
          proof={'date':date,'track':'Zia Park','race':10,'field':'post_time_et','old':r['post_time_et'],'new':'6:08 PM','source_pdf_sha256':'b0cf5187101773346dcdc89d69c02e7479b065e0d7d7a057bbc63c961610b9c9','source_pdf_page':27,'parent_scratch_release_sha256':parent,'previous_dashboard_sha256':sha(raw),'corrected_dashboard_sha256':sha(raw2),'unchanged_f4_sha256':sha(fraw),'verified_at':datetime.now(timezone.utc).isoformat()}
          pk='projections/qa/'+date+'/zia-r10-post-time-correction.json';pr=compact(proof);s.put_object(Bucket=b,Key=pk,Body=pr,ContentType='application/json',CacheControl='private,no-store');assert get(pk)[0]==pr
          print('ZIA_METADATA_REPAIR_READBACK_PASS 10 races 79 runners; F4 unchanged',flush=True)
          for i in range(6):
            req=urllib.request.Request('https://railandryeracing.com/api/products?qa=zia-fixed-'+str(i),headers={'Cache-Control':'no-cache','User-Agent':'RailRyeReleaseQA/1'})
            with urllib.request.urlopen(req,timeout=25) as res:products=json.load(res)['products']
            rows=products+[q for p in products for q in p.get('included_products',[])]
            tracks=sorted({p['track'] for p in rows if p.get('category')=='Race Cards' and p.get('race_date')==date and p.get('track')})
            print('PUBLIC_CATALOG_TRACKS',len(tracks),','.join(tracks),flush=True)
            if 'Zia Park' in tracks and len(tracks)==15:
              print('ZIA_PUBLIC_CATALOG_PASS 15/15',flush=True);break
            time.sleep(5)
          else:raise RuntimeError('Zia corrected but public catalog still incomplete')
          PY
