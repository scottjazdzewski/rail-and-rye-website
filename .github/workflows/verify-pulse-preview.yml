name: Verify Race-Day Pulse preview and calibration
on:
  pull_request:
    paths:
      - 'src/race-day-pulse.js'
      - 'src/projections.js'
      - 'public/index.html'
      - 'public/assets/race-day-pulse.*'
      - 'test-race-day-pulse*'
      - '.github/workflows/verify-pulse-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pulse-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and release-gating regression
        run: |
          node --check src/race-day-pulse.js
          node --check public/assets/race-day-pulse.js
          node test-race-day-pulse.mjs
          node test-homepage-lock.mjs
      - name: Install browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real viewport, share and screenshot QA
        run: node test-race-day-pulse-browser.mjs
      - name: Preserve screenshots for visual owner approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-preview-six-viewports
          path: pulse-preview-screenshots/*.png
          if-no-files-found: ignore
