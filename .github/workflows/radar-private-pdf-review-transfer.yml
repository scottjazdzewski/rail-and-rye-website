name: Secure private Radar Nov 23 published-card transfer
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  encrypted-radar-ingest:
    if: github.event.issue.number == 173 && github.event.comment.user.login == 'scottjazdzewski' && startsWith(github.event.comment.body, 'RR_RADAR_REVIEW_ENCRYPTED_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private sealed-box and S3 clients
        run: pip install pynacl==1.5.0 boto3==1.40.36
      - name: Decrypt private PDF publication and write to R2 with readback check
        env:
          TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
          TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
          TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
        run: python scripts/radar_private_pdf_bridge.py
