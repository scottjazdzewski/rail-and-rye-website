name: Publish sealed TRI scratch-final projections to private R2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rr-secure-scratch-ingest.yml'
      - 'private-ingest/1123-scratch.enc.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rr-private-scratch-r2-20261123
  cancel-in-progress: false
jobs:
  publish-private-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      TRI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRI_CLOUDFLARE_ACCOUNT_ID }}
      TRI_R2_ACCESS_KEY_ID: ${{ secrets.TRI_R2_ACCESS_KEY_ID }}
      TRI_R2_SECRET_ACCESS_KEY: ${{ secrets.TRI_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Secure R2 handshake or sealed scratch-final publication
        run: |
          python -m pip install --disable-pip-version-check --quiet boto3 cryptography
          python scripts/rr_scratch_private_ingest.py
