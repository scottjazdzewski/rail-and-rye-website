name: Verify canonical Racing Wire badges
on:
  pull_request:
    paths:
      - 'public/preview/racing-wire-5333548f0ffee31ba519b2470ffb/**'
      - 'public/assets/approved/racing-wire/badges/**'
      - 'test-racing-wire.mjs'
      - '.github/workflows/verify-canonical-racing-wire-badges.yml'
jobs:
  racing-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-sqlite test-racing-wire.mjs
